services:
  front:
    build:
      context: .
      dockerfile: docker/php-apache/Dockerfile
      args:
        APP_PUBLIC_DIR: front/public
    container_name: quickevents-front
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_CHARSET: ${DB_CHARSET}
    ports:
      - "${FRONT_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy

  back:
    build:
      context: .
      dockerfile: docker/php-apache/Dockerfile
      args:
        APP_PUBLIC_DIR: back/public
    container_name: quickevents-back
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_CHARSET: ${DB_CHARSET}
    ports:
      - "${BACK_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: quickevents-db
    command: --default-authentication-plugin=mysql_native_password
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - quickevents_db_data:/var/lib/mysql
      - ./back/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./back/database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  quickevents_db_data: