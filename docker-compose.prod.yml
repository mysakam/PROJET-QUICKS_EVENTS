services:
  proxy:
    image: nginx:1.27-alpine
    container_name: quickevents-proxy
    depends_on:
      - front
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  front:
    build:
      context: .
      dockerfile: docker/php-apache/Dockerfile
      args:
        APP_PUBLIC_DIR: front/public
    container_name: quickevents-front-prod
    env_file:
      - .env.production
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_CHARSET: ${DB_CHARSET}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  back:
    build:
      context: .
      dockerfile: docker/php-apache/Dockerfile
      args:
        APP_PUBLIC_DIR: back/public
    container_name: quickevents-back-prod
    env_file:
      - .env.production
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_CHARSET: ${DB_CHARSET}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: quickevents-db-prod
    command: --default-authentication-plugin=mysql_native_password
    env_file:
      - .env.production
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - quickevents_prod_db_data:/var/lib/mysql
      - ./back/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  quickevents_prod_db_data: