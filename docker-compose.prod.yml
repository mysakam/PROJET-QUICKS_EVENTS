services:
  traefik:
    image: traefik:v3.1
    container_name: quickevents-traefik
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/acme.json:/letsencrypt/acme.json
    restart: unless-stopped

  front:
    build:
      context: .
      dockerfile: docker/php-apache/Dockerfile
      args:
        APP_PUBLIC_DIR: front/public
    container_name: quickevents-front-prod
    env_file:
      - .env.production
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_CHARSET: ${DB_CHARSET}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
    labels:
      - traefik.enable=true
      - traefik.http.routers.quickevents-front.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.quickevents-front.entrypoints=web,websecure
      - traefik.http.routers.quickevents-front.tls=true
      - traefik.http.routers.quickevents-front.tls.certresolver=letsencrypt
      - traefik.http.services.quickevents-front.loadbalancer.server.port=80
      - traefik.http.routers.quickevents-front-http.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.quickevents-front-http.entrypoints=web
      - traefik.http.routers.quickevents-front-http.middlewares=redirect-to-https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  back:
    build:
      context: .
      dockerfile: docker/php-apache/Dockerfile
      args:
        APP_PUBLIC_DIR: back/public
    container_name: quickevents-back-prod
    env_file:
      - .env.production
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_CHARSET: ${DB_CHARSET}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
    labels:
      - traefik.enable=true
      - traefik.http.routers.quickevents-back.rule=Host(`${ADMIN_DOMAIN}`)
      - traefik.http.routers.quickevents-back.entrypoints=web,websecure
      - traefik.http.routers.quickevents-back.tls=true
      - traefik.http.routers.quickevents-back.tls.certresolver=letsencrypt
      - traefik.http.services.quickevents-back.loadbalancer.server.port=80
      - traefik.http.routers.quickevents-back-http.rule=Host(`${ADMIN_DOMAIN}`)
      - traefik.http.routers.quickevents-back-http.entrypoints=web
      - traefik.http.routers.quickevents-back-http.middlewares=redirect-to-https
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: quickevents-db-prod
    command: --default-authentication-plugin=mysql_native_password
    env_file:
      - .env.production
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - quickevents_prod_db_data:/var/lib/mysql
      - ./back/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  quickevents_prod_db_data: